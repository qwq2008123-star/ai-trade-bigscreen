<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球贸易经济分析大屏 · 福建省</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b1c34' stroke='%234d8dff' stroke-width='2'/%3E%3Cpath d='M3 16h26M16 3c6 5 6 21 0 26M16 3c-6 5-6 21 0 26' fill='none' stroke='%237ef0cf' stroke-width='2'/%3E%3C/svg%3E">
<script src="js/entry.js?v=1"></script>
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="stylesheet" href="css/screen2.css?v=16">
<link rel="stylesheet" href="css/detail.css?v=5">
<script src="vendor/echarts.min.js?v=1"></script>
<script src="vendor/three.min.js?v=1"></script>
<script src="js/fujian.js?v=7"></script>
<script src="js/data.js?v=4"></script>
<script src="js/api.js?v=8"></script>
<script src="js/dataset.js?v=8"></script>
<script src="js/detail.js?v=5"></script>
</head>
<body>
<div id="viewport">
  <div id="stage" class="stage-map">
    <div class="bg-grid bg-grid-map"></div>

    <!-- 3D 福建地图 -->
    <div id="map-wrap">
      <div id="map3d"></div>
      <div id="map-labels"></div>
      <div id="map-bloom"></div>
    </div>

    <!-- 右侧压暗层：让地图辉光不侵入面板区 -->
    <div class="sd-scrim"></div>

    <!-- 顶部标题栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="main-title">全球贸易经济分析大屏</h1>
        <span class="divider"></span>
        <span class="sub-title">Global Trade and Economic Analysis Screen</span>
      </div>
      <div class="topbar-right">
        <span class="datetime" id="clock">----.--.-- --:--:--</span>
      </div>
    </header>

    <!-- 左侧核心指标 -->
    <aside class="sd-kpi" id="sdKpi"></aside>

    <!-- 指北针 -->
    <div class="compass">
      <span class="compass-n">N</span>
      <div class="compass-dial">
        <svg viewBox="0 0 100 100">
          <path d="M27 10.2 A46 46 0 0 1 89.8 73" fill="none" stroke="rgba(186,216,252,.3)" stroke-width="2" stroke-linecap="round"/>
          <path d="M42 32 L55 64 L42 56 L29 64 Z" fill="#eaf3ff" transform="rotate(20 42 48)"/>
        </svg>
      </div>
    </div>

    <!-- 供应链图层：六个图层各读一个来源，面板上把来源与合计写清楚 -->
    <aside class="sd-layers" id="sdLayers">
      <div class="layer-title"><i></i>福建供应链图层</div>
      <div class="layer-btns" id="layerBtns"></div>
      <div class="layer-info" id="layerInfo"></div>
    </aside>

    <!-- 数据来源标注：本页金额全部是示例数据，口径见 data/regions.json -->
    <div class="map-src" id="mapSrc">示例数据 · 金额来自 data/regions.json 福建省（城市之和=全省）· 月度为年额×季节系数</div>

    <!-- 地图指标切换 -->
    <nav class="sd-tabs" id="sdTabs">
      <button class="tab sd-tab active" data-tab="all">全部数据</button>
      <button class="tab sd-tab" data-tab="import">进口数据</button>
      <button class="tab sd-tab" data-tab="export">出口数据</button>
    </nav>

    <!-- 右侧数据面板 -->
    <aside class="sd-right">
      <section class="sd-panel" style="top:142px">
        <div class="section-title"><i></i>进出口商品品类占比</div>
        <div class="share-body">
          <div class="share-gauge">
            <div class="gauge-ring"></div>
            <div class="gauge-core">
              <svg viewBox="0 0 24 24" width="30" height="30">
                <g transform="rotate(-45 12 12)">
                  <path d="M4 4h9l7 7-9 9-7-7z" fill="#eef5ff"/>
                  <circle cx="8.4" cy="8.4" r="2.1" fill="#16325a"/>
                </g>
              </svg>
            </div>
            <div id="shareChart" class="share-chart"></div>
          </div>
          <ul class="share-legend" id="shareLegend"></ul>
        </div>
      </section>

      <section class="sd-panel" style="top:420px">
        <div class="section-title"><i></i>月度进出口商品总价值</div>
        <div id="monthChart" class="month-chart"></div>
        <!-- 月度回放：就塞在月度面板与品类表之间那条空隙里，不新增块、不动任何面板的 top -->
        <div class="month-scrub" id="monthScrub"></div>
      </section>

      <section class="sd-panel" style="top:699px">
        <div class="section-title"><i></i>进出口商品品类贸易值</div>
        <table class="sd-table">
          <thead><tr><th>序号</th><th>品类</th><th>占比(%)</th><th>贸易值(亿元)</th></tr></thead>
          <tbody id="sdTableBody"></tbody>
        </table>
      </section>
    </aside>
  </div>
</div>
<script src="js/screen2.js?v=20"></script>
</body>
</html>
