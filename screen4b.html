<body data-view="b">
<div id="viewport">
  <div id="stage">
    <div class="bg-grid"></div>

    <header class="topbar">
      <div class="topbar-left">
        <h1 class="main-title">AI 经营分析与建议</h1>
        <span class="divider"></span>
        <span class="sub-title">AI Store Insights · 今天发生了什么 → 客户在做什么 → 接下来做什么</span>
      </div>
      <div class="topbar-right">
        <span class="sub-title" id="spProvider">数据源</span>
        <span class="datetime" id="spClock">--</span>
      </div>
    </header>

    <!-- 左：店铺上下文 + 经营全流程（AI 指令在商品与客服页） -->

      <section class="ai-card">

        <div class="ai-tit"><span><i></i>AI 经营全流程</span><em>带 ↗ 的步骤在其他页</em></div>
        <ul class="ai-flow" id="spFlow"></ul>
      </section>
    </aside>

    <!-- 右：店铺总览 / 客户洞察 / 经营中心 -->
    <main class="ai-main">
      <nav class="ai-tabs" id="spTabs"></nav>
      <div class="ai-body" id="spBody"></div>
    </main>
  </div>
