<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 商品与客服工作台 · AI 全球电商市场与获客平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230b1c34' stroke='%234d8dff' stroke-width='2'/%3E%3Cpath d='M3 16h26M16 3c6 5 6 21 0 26M16 3c-6 5-6 21 0 26' fill='none' stroke='%237ef0cf' stroke-width='2'/%3E%3C/svg%3E">
<script src="js/entry.js?v=1"></script>
<link rel="stylesheet" href="css/style.css?v=5">
<link rel="stylesheet" href="css/ai.css?v=9">
<link rel="stylesheet" href="css/shop.css?v=25">
<script src="vendor/echarts.min.js?v=1"></script>
<script src="js/data.js?v=4"></script>
<script src="js/api.js?v=8"></script>
<script src="js/dataset.js?v=8"></script>
<script src="js/ai.js?v=6"></script>
<script src="js/shop.js?v=15"></script>
<script src="js/db.js?v=13"></script>
<script src="js/shell.js?v=2"></script>
</head>
<body data-view="a">
<div id="viewport">
  <div id="stage">
    <div class="bg-grid"></div>

    <header class="topbar">
      <div class="topbar-left">
        <h1 class="main-title">AI 商品与客服工作台</h1>
        <span class="divider"></span>
        <span class="sub-title">AI Store Execution · 这个产品能不能进这个市场 → 文案 → 接待</span>
      </div>
      <div class="topbar-right">
        <span class="sub-title" id="spProvider">数据源</span>
        <span class="datetime" id="spClock">--</span>
      </div>
    </header>

    <!-- 左：店铺上下文 + 指令输入 + 经营全流程 -->
    <aside class="ai-side">
      <section class="ai-card">
        <div class="ai-tit"><span><i></i>店铺上下文</span><em id="spShopSrc">读取中</em></div>
        <div class="sp-shop" id="spShop">读取中…</div>
      </section>

      <section class="ai-card">
        <div class="ai-tit"><span><i></i>AI 指令</span><em>市场适配 / 商品生成用</em></div>
        <label class="ai-lb">产品</label>
        <input class="ai-in" id="spProduct" placeholder="真无线降噪耳机 / 智能手表">
        <label class="ai-lb">目标国家</label>
        <select class="ai-se" id="spIso"></select>
        <label class="ai-lb">目标人群</label>
        <input class="ai-in" id="spAudience" placeholder="25-40 岁通勤与健身用户">
        <label class="ai-lb">补充说明（可选）</label>
        <textarea class="ai-ta" id="spQuery" placeholder="例如：客单价 35 美元以内，主打通勤降噪，需要西语详情页"></textarea>
        <div class="ai-chips" id="spSamples"></div>
        <button class="ai-run" id="spRun" type="button">运 行 AI 分 析</button>
      </section>

      <section class="ai-card grow">
        <div class="ai-tit"><span><i></i>AI 经营全流程</span><em>带 ↗ 的步骤在其他页</em></div>
        <ul class="ai-flow" id="spFlow"></ul>
      </section>
    </aside>

    <!-- 右：市场适配 / 商品管理 / 客服中心 -->
    <main class="ai-main">
      <nav class="ai-tabs" id="spTabs"></nav>
      <div class="ai-body" id="spBody"></div>
    </main>
  </div>
</div>
<script src="js/screen4.js?v=66"></script>
</body>
</html>
